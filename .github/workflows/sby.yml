name: Build and Release SymbiYosys

on:
  workflow_dispatch:
    inputs:
      runner_version:
        description: 'runner version to build'
        required: true
        default: 'ubuntu-22.04'

      repo_version:
        description: 'repo branch, tag, or commit hash to build'
        required: true
        default: 'main'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ github.event.inputs.runner_version }}
    steps:
      - name: Checkout User Repository
        uses: actions/checkout@v4

      - name: Determine Target Version
        run: |
          RUNNER_VERSION="ubuntu-22.04"
          REPO_VERSION="main"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUNNER_VERSION="${{ github.event.inputs.runner_version }}"
            REPO_VERSION="${{ github.event.inputs.repo_version }}"
          fi
          echo "RUNNER_VERSION=$RUNNER_VERSION" >> "$GITHUB_ENV"
          echo "REPO_VERSION=$REPO_VERSION" >> "$GITHUB_ENV"

      - name: Clone Official SymbiYosys Repository
        run: |
          git clone https://github.com/YosysHQ/sby.git
          cd sby
          git checkout "$REPO_VERSION"
          REPO_TAG_VERSION=$(git describe --tags --always)
          echo "REPO_TAG_VERSION=$REPO_TAG_VERSION" >> "$GITHUB_ENV"
          echo "Current SymbiYosys version to build: $REPO_TAG_VERSION"

      - name: Check for Existing Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "sby-${REPO_TAG_VERSION}" \
              --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release sby-${REPO_TAG_VERSION} already exists."
            echo "Skipping build."
            echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_BUILD=false" >> "$GITHUB_ENV"
            PACKAGE_NAME="sby-${REPO_TAG_VERSION}-${RUNNER_VERSION}"
            echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          fi

      - name: Install Build and Test Dependencies
        if: env.SKIP_BUILD == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-click yosys z3

      - name: Install SymbiYosys to Staging Directory
        if: env.SKIP_BUILD == 'false'
        run: |
          cd sby
          make DESTDIR="$PWD/staging" install
          test -x staging/usr/local/bin/sby

      - name: Package Artifacts and Generate SHA256
        if: env.SKIP_BUILD == 'false'
        run: |
          cd sby/staging/usr/local
          tar -czvf "../../../${PACKAGE_NAME}.tar.gz" *
          cd ../../..
          sha256sum "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.sha256"

      - name: Smoke Test Packaged SymbiYosys
        if: env.SKIP_BUILD == 'false'
        run: |
          mkdir -p sby-smoke
          tar -xzvf "sby/${PACKAGE_NAME}.tar.gz" -C sby-smoke
          test -x sby-smoke/bin/sby
          "$GITHUB_WORKSPACE/sby-smoke/bin/sby" --version
          (
            cd sby/sbysrc
            SBY_BIN="$GITHUB_WORKSPACE/sby-smoke/bin/sby"
            PATH="$GITHUB_WORKSPACE/sby-smoke/bin:$PATH" "$SBY_BIN" -f demo1.sby
          )

      - name: Upload to Actions Artifacts
        if: env.SKIP_BUILD == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            sby/${{ env.PACKAGE_NAME }}.tar.gz
            sby/${{ env.PACKAGE_NAME }}.tar.gz.sha256
          retention-days: 90

      - name: Publish to GitHub Releases
        if: env.SKIP_BUILD == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sby-${{ env.REPO_TAG_VERSION }}
          name: "SymbiYosys ${{ env.REPO_TAG_VERSION }}"
          body: |
            Automated build of SymbiYosys (sby) ${{ env.REPO_TAG_VERSION }}.

            **Build Commit Source:**
            https://github.com/YosysHQ/sby/tree/${{ env.REPO_TAG_VERSION }}

            ### Usage
            1. Download `${{ env.PACKAGE_NAME }}.tar.gz`.
            2. Extract: `tar -xzvf ${{ env.PACKAGE_NAME }}.tar.gz`.
            3. Run: `./bin/sby --version`.

            This archive contains the SymbiYosys front end. Formal jobs require
            Python 3 with Click, Yosys, and an appropriate solver (for example,
            Z3) available on `PATH`.
          files: |
            sby/${{ env.PACKAGE_NAME }}.tar.gz
            sby/${{ env.PACKAGE_NAME }}.tar.gz.sha256
