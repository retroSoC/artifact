name: Build and Release Yosys

on:
  # 1. Manual trigger (Can specify branch/tag/commit)
  workflow_dispatch:
    inputs:
      runner_version:
        description: 'runner version to build'
        required: true
        default: 'ubuntu-22.04'

      repo_version:
        description: 'repo branch, tag, or commit hash to build'
        required: true
        default: 'v0.58'

      toolchain_version:
        description: 'c compiler to build'
        required: true
        default: 'gcc'

  # 2. Scheduled automatic update check (Every Monday at 02:00 UTC)
  # schedule:
  #   - cron: '0 2 * * 1'
  # 3. Tag push trigger (When you push a v* tag to your repository)
  # push:
  #   tags:
  #     - 'v*'

permissions:
  contents: write # Grant permissions to create Releases and upload assets

jobs:
  build-and-release:
    runs-on: ${{ github.event.inputs.runner_version }}
    steps:
      - name: Checkout User Repository
        uses: actions/checkout@v4

      - name: Determine Target Version
        id: target
        run: |
          RUNNER_VERSION="ubuntu-22.04"
          REPO_VERSION="master"
          TOOLCHAIN_VERSION="gcc"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            RUNNER_VERSION="${{ github.event.inputs.runner_version }}"
            REPO_VERSION="${{ github.event.inputs.repo_version }}"
            TOOLCHAIN_VERSION="${{ github.event.inputs.toolchain_version }}"
          fi
          echo "RUNNER_VERSION=$RUNNER_VERSION" >> $GITHUB_ENV
          echo "REPO_VERSION=$REPO_VERSION" >> $GITHUB_ENV
          echo "TOOLCHAIN_VERSION=$TOOLCHAIN_VERSION" >> $GITHUB_ENV

      - name: Clone Official Yosys Repository
        run: |
          git clone https://github.com/YosysHQ/yosys.git
          cd yosys
          git checkout ${{ env.REPO_VERSION }}
          git submodule update --init --recursive
          # Use official Tag or Commit Hash as the version number
          REPO_TAG_VERSION=$(git describe --tags --always)
          echo "REPO_TAG_VERSION=$REPO_TAG_VERSION" >> $GITHUB_ENV
          echo "Current Yosys version to build: $REPO_TAG_VERSION"

      - name: Check for Existing Release (Avoid duplicate builds)
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if a Release for this version already exists in the current repository
          if gh release view "yosys-${{ env.REPO_TAG_VERSION }}" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "Release ${{ env.REPO_TAG_VERSION }} already exists! Skipping build."
            echo "SKIP_BUILD=true" >> $GITHUB_ENV
          else
            echo "SKIP_BUILD=false" >> $GITHUB_ENV
            echo "PACKAGE_NAME=yosys-${{ env.REPO_TAG_VERSION }}-${{ env.RUNNER_VERSION }}-${{ env.TOOLCHAIN_VERSION }}" >> $GITHUB_ENV
          fi

      - name: Install Build Dependencies (Full compilation environment)
        if: env.SKIP_BUILD == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk git make python3 python3-pip lld bison clang flex \
                                       libffi-dev libfl-dev libreadline-dev pkg-config tcl-dev zlib1g-dev \
                                       graphviz xdot build-essential cmake

      - name: Compile Yosys
        if: env.SKIP_BUILD == 'false'
        run: |
          cd yosys
          if [ -f CMakeLists.txt ]; then
            # Yosys v0.67 and later use CMake and require CMake 3.28 or newer.
            if ! cmake --version | awk 'NR == 1 { split($3, version, "."); exit !(version[1] > 3 || (version[1] == 3 && version[2] >= 28)) }'; then
              python3 -m pip install --user 'cmake>=3.28,<4'
              export PATH="$HOME/.local/bin:$PATH"
              hash -r
            fi
            cmake --version
            cmake -B build . -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_GTest=TRUE
            cmake --build build --config Release --parallel "$(nproc)"
            cmake --install build --prefix "$PWD/install" --strip
            DESTDIR="$PWD/staging" cmake --install build --strip
            echo "YOSYS_BUILD_SYSTEM=cmake" >> "$GITHUB_ENV"
          else
            make config-gcc
            make -j"$(nproc)"
            make install PREFIX="$PWD/install"
            make DESTDIR="$PWD/staging" install
            echo "YOSYS_BUILD_SYSTEM=make" >> "$GITHUB_ENV"
          fi
          export PATH="$PWD/install/bin:$PATH"
          echo "$PWD/install/bin" >> "$GITHUB_PATH"
          yosys --version
          yosys-config --help
          echo "== PRINT INSTALL DIR =="
          mkdir -p staging/usr/local/share/yosys/plugins
          cd ..

      - name: Compile Yosys-Slang Plugin
        if: env.SKIP_BUILD == 'false'
        run: |
          if [ "${YOSYS_BUILD_SYSTEM}" = "cmake" ]; then
            echo "Yosys v0.67 and later include sv-elab; skipping the standalone yosys-slang plugin."
            exit 0
          fi
          git clone --recursive https://github.com/povik/yosys-slang
          cd yosys-slang/build
          cmake ..
          make -j$(nproc)
          echo "== PRINT INSTALL DIR =="
          cp -rf slang.so ../../yosys/staging/usr/local/share/yosys/plugins
          cd ../..

      - name: Package Artifacts and Generate SHA256 (Ready-to-use + Integrity verification)
        if: env.SKIP_BUILD == 'false'
        run: |
          echo "PACKAGE NAME: ${{ env.PACKAGE_NAME }}"
          cd yosys/staging/usr/local
          # Package files removing prefix paths; bin/yosys will be at the root after extraction
          tar -czvf ../../../${{ env.PACKAGE_NAME }}.tar.gz *
          cd ../../..
          # Generate SHA256 checksum
          sha256sum ${{ env.PACKAGE_NAME }}.tar.gz > ${{ env.PACKAGE_NAME }}.tar.gz.sha256
          echo "== PRINT CURRENT DIR =="
          cd ..
          echo "== PRINT CURRENT DIR =="

      - name: Upload to Actions Artifacts(Temporary storage)
        if: env.SKIP_BUILD == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            yosys/${{ env.PACKAGE_NAME }}.tar.gz
            yosys/${{ env.PACKAGE_NAME }}.tar.gz.sha256
          retention-days: 90 # Retain for 90 days

      - name: Publish to GitHub Releases (Permanent release)
        if: env.SKIP_BUILD == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yosys-${{ env.REPO_TAG_VERSION }}
          name: "Yosys ${{ env.REPO_TAG_VERSION }}"
          body: |
            Automated build of Yosys ${{ env.REPO_TAG_VERSION }}.

            **Build Commit Source:** https://github.com/YosysHQ/yosys/tree/${{ env.REPO_TAG_VERSION }}
            
            ### 🚀 Ready to use (How to use)
            1. Download `${{ env.PACKAGE_NAME }}.tar.gz`
            2. Extract: `tar -xzvf ${{ env.PACKAGE_NAME }}.tar.gz`
            3. Run: `./bin/yosys`
            
            *This archive has been pre-configured with relative paths for 'share'. No need to run `make install` or configure environment variables—simply extract and run.*
          files: |
            yosys/${{ env.PACKAGE_NAME }}.tar.gz
            yosys/${{ env.PACKAGE_NAME }}.tar.gz.sha256